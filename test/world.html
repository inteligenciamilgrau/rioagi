<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WORLD — inspeção da favela</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0e; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 5;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #e8e2d8; background: rgba(10,11,13,.72); border: 1px solid #2a2d33;
      padding: 10px 12px; border-radius: 6px; min-width: 260px; white-space: pre;
      pointer-events: none;
    }
    #ajuda {
      position: fixed; bottom: 10px; left: 10px; z-index: 5;
      font: 11px/1.5 ui-monospace, monospace; color: #9aa0a8;
      background: rgba(10,11,13,.6); padding: 7px 10px; border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="hud">gerando…</div>
  <div id="ajuda">arrastar = orbitar · roda = zoom · W = wireframe · N = navGrid · C = cobertura · S = spawns · 1..6 = câmeras</div>
  <script type="module">
    // ATENCAO: esta pagina e um BANCO DE TESTE do modulo WORLD, nao parte do jogo.
    // Ela cria o proprio renderer/luz de proposito, para inspecionar a geometria
    // sem depender dos modulos CORE/MAT (que outros agentes estao escrevendo).
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { World } from '/src/world/World.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#b9c6d4');
    scene.fog = new THREE.Fog('#c4c9cc', 150, 620);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);
    camera.position.set(96, 74, 118);

    // --- entardecer no Rio: sol raso e alaranjado ---
    const sol = new THREE.DirectionalLight('#ffc08c', 3.6);
    sol.position.set(-96, 42, 78);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    sol.shadow.camera.left = -110; sol.shadow.camera.right = 110;
    sol.shadow.camera.top = 110; sol.shadow.camera.bottom = -110;
    sol.shadow.camera.near = 1; sol.shadow.camera.far = 340;
    sol.shadow.bias = -0.0007;
    sol.shadow.normalBias = 0.035;
    scene.add(sol);
    const hemi = new THREE.HemisphereLight('#b3d2ea', '#7a6a52', 3.0);
    scene.add(hemi);
    const fill = new THREE.DirectionalLight('#9db6d2', 1.0);
    fill.position.set(70, 30, -80);
    scene.add(fill);
    // luz "plana" para julgar geometria sem o contraste do entardecer esconder nada
    window.__luzPlana = (on) => {
      hemi.intensity = on ? 5.2 : 3.0;
      sol.intensity = on ? 1.2 : 3.6;
      fill.intensity = on ? 1.8 : 1.0;
    };

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 12, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxDistance = 420;

    const hud = document.getElementById('hud');

    const ctxFake = { scene, camera, renderer, settings: null, materials: null };
    const world = new World(ctxFake, { seed: Number(new URLSearchParams(location.search).get('seed')) || 20260728 });
    await world.init();

    // --- overlays de depuracao ---
    const overlays = new THREE.Group();
    scene.add(overlays);

    function fazNavGrid() {
      const ng = world.navGrid;
      const pts = [];
      for (let j = 0; j < ng.height; j += 1) {
        for (let i = 0; i < ng.width; i += 1) {
          if (!ng.isWalkable(i, j)) continue;
          pts.push(ng.origin.x + (i + .5) * ng.cellSize, ng.heightData[j * ng.width + i] + 0.06,
            ng.origin.z + (j + .5) * ng.cellSize);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const m = new THREE.PointsMaterial({ color: 0x33ff88, size: 0.24, sizeAttenuation: true });
      const p = new THREE.Points(g, m);
      p.visible = false;
      overlays.add(p);
      return p;
    }
    function fazPontos(lista, cor, alturaOff) {
      const pts = [];
      for (const c of lista) pts.push(c.position.x, c.position.y + alturaOff, c.position.z);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const p = new THREE.Points(g, new THREE.PointsMaterial({ color: cor, size: 1.1, sizeAttenuation: true }));
      p.visible = false;
      overlays.add(p);
      return p;
    }
    const ovNav = fazNavGrid();
    const ovCob = fazPontos(world.getCoverPoints(), 0xff5533, 0.9);
    const ovSpn = fazPontos(world.getSpawnPoints(), 0x33aaff, 1.4);

    // --- camaras pre-definidas para as fotos ---
    const spawns = world.getSpawnPoints();
    const CAMS = {
      aerea: [[0, 150, 150], [0, 14, -6], 55],
      encosta: [[86, 58, 96], [-6, 22, -14], 46],
      rasante: [[62, 30, 66], [-10, 16, -6], 40],
    };
    function poseCam(p, t, fov) {
      controls.enabled = false;
      camera.position.set(p[0], p[1], p[2]);
      controls.target.set(t[0], t[1], t[2]);
      camera.fov = fov ?? camera.fov;
      camera.updateProjectionMatrix();
      camera.lookAt(t[0], t[1], t[2]);
      controls.enabled = true;
      controls.update();
    }

    // --- ganchos para o Playwright ---
    window.__world = world;
    window.__three = { scene, camera, renderer, controls };
    window.__pose = (p, t, fov) => { poseCam(p, t, fov); render(); render(); };
    window.__wire = (on) => { world.setWireframe(!!on); render(); };
    window.__overlay = (qual, on) => {
      ({ nav: ovNav, cobertura: ovCob, spawn: ovSpn })[qual].visible = !!on; render();
    };
    window.__stats = () => ({
      drawCalls: renderer.info.render.calls,
      triangulos: renderer.info.render.triangles,
      geometrias: renderer.info.memory.geometries,
      texturas: renderer.info.memory.textures,
      programas: renderer.info.programs?.length ?? 0,
      mundo: world.stats,
      navAndavel: world.navGrid.walkableCount,
    });
    /** Poe a camera na altura do olho num ponto andavel, olhando numa direcao. */
    window.__olho = (x, z, yaw, alturaOlho = 1.68, alcance = 40) => {
      const y = world.collision.groundAt(x, z, 200) + alturaOlho;
      poseCam([x, y, z], [x + Math.sin(yaw) * alcance, y - alcance * 0.16, z + Math.cos(yaw) * alcance], 75);
      render(); render();
    };
    window.__spawnCam = (i, yaw = 0) => {
      const s = spawns[i % spawns.length];
      window.__olho(s.position.x, s.position.z, yaw !== null ? yaw : s.yaw);
      return { x: s.position.x, z: s.position.z, y: s.position.y };
    };

    // --- HUD ---
    function atualizaHud() {
      const s = world.stats;
      hud.textContent =
        `DRAW CALLS   ${renderer.info.render.calls}\n` +
        `TRIANGULOS   ${(renderer.info.render.triangles / 1000).toFixed(1)}k\n` +
        `objetos      ${s.objetosCena}  (merge ${s.meshesMerged} / inst ${s.meshesInstanced})\n` +
        `geometrias   ${renderer.info.memory.geometries}   texturas ${renderer.info.memory.textures}\n` +
        `─────────────────────────\n` +
        `seed         ${s.seed}   gerado em ${s.msGeracao} ms\n` +
        `casas        ${s.casas}     vias ${s.vias}    muros ${s.muros}\n` +
        `postes       ${s.postes}     fios ${s.fios}    varais ${s.varais}\n` +
        `arvores      ${s.arvores}    capim ${s.capim}\n` +
        `desnivel     ${s.cotaMin} .. ${s.cotaMax} m\n` +
        `colisao      ${(s.trisColisao / 1000).toFixed(1)}k tris\n` +
        `spawns ${s.spawns}   coberturas ${s.coberturas}\n` +
        `cam ${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)}`;
    }

    let wire = false;
    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w') { wire = !wire; world.setWireframe(wire); }
      if (k === 'n') ovNav.visible = !ovNav.visible;
      if (k === 'c') ovCob.visible = !ovCob.visible;
      if (k === 's') ovSpn.visible = !ovSpn.visible;
      if (k === '1') poseCam(...CAMS.aerea);
      if (k === '2') poseCam(...CAMS.encosta);
      if (k === '3') poseCam(...CAMS.rasante);
      if (k === '4') window.__spawnCam(0);
      if (k === '5') window.__spawnCam(4);
      if (k === '6') window.__spawnCam(9);
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function render() {
      world.update(1 / 60, performance.now() / 1000);
      renderer.render(scene, camera);
      atualizaHud();
    }
    let raf = 0, rodando = true;
    function loop() {
      raf = requestAnimationFrame(loop);
      controls.update();
      render();
    }
    // O Playwright roda em SwiftShader (software): com o loop ativo, cada
    // screenshot briga com o proximo frame e estoura o timeout. Este gancho
    // congela o loop e deixa so os renders explicitos de __pose/__wire.
    window.__pausar = () => { rodando = false; cancelAnimationFrame(raf); };
    window.__retomar = () => { if (!rodando) { rodando = true; loop(); } };
    poseCam(...CAMS.aerea);
    loop();
    window.__pronto = true;
    console.log('[world.html] pronto', world.stats);
  </script>
</body>
</html>
